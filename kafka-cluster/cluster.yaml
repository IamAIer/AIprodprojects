AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Disposable three-node Apache Kafka 3.9.2 and ZooKeeper development cluster.
  Each node runs one broker and one ZooKeeper member. Not for production use.

Parameters:
  AllowedClientCidr:
    Type: String
    Description: >-
      Public IPv4 CIDR allowed to connect to Kafka on port 9094. Use your
      current public IP followed by /32; avoid 0.0.0.0/0.
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$'
    ConstraintDescription: Enter an IPv4 CIDR such as 203.0.113.10/32.
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.small
      - t3.medium
    Description: EC2 size for each broker and ZooKeeper node.
  KafkaVersion:
    Type: String
    Default: '3.9.2'
    AllowedValues:
      - '3.9.2'
    Description: >-
      Kafka 3.9.2 is pinned because Apache Kafka 4.x removed ZooKeeper mode.
      Upgrade deliberately and keep ZooKeeper compatibility in mind.
  DataVolumeSizeGiB:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100
    Description: Encrypted gp3 data volume size per node. All volumes delete with the stack.

Resources:
  KafkaVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref KafkaVpc
      CidrBlock: 10.20.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-subnet'
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw'
  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref KafkaVpc
      InternetGatewayId: !Ref InternetGateway
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref KafkaVpc
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  KafkaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Restricted Kafka client access and private cluster traffic
      VpcId: !Ref KafkaVpc
      SecurityGroupIngress:
        - Description: Kafka external client listener from the configured client CIDR
          IpProtocol: tcp
          FromPort: 9094
          ToPort: 9094
          CidrIp: !Ref AllowedClientCidr

      SecurityGroupEgress:
        - Description: Outbound downloads, SSM access, and package updates
          IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nodes-sg'
  KafkaInternalIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref KafkaSecurityGroup
      Description: Kafka inter-broker listener within this cluster only
      IpProtocol: tcp
      FromPort: 9092
      ToPort: 9092
      SourceSecurityGroupId: !Ref KafkaSecurityGroup
  ZooKeeperClientIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref KafkaSecurityGroup
      Description: ZooKeeper client listener within this cluster only
      IpProtocol: tcp
      FromPort: 2181
      ToPort: 2181
      SourceSecurityGroupId: !Ref KafkaSecurityGroup
  ZooKeeperQuorumIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref KafkaSecurityGroup
      Description: ZooKeeper quorum traffic within this cluster only
      IpProtocol: tcp
      FromPort: 2888
      ToPort: 3888
      SourceSecurityGroupId: !Ref KafkaSecurityGroup
  KafkaNodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-node-role'
  KafkaNodeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref KafkaNodeRole

  KafkaNode1:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref KafkaNodeInstanceProfile
      SubnetId: !Ref PublicSubnet
      PrivateIpAddress: 10.20.1.11
      SecurityGroupIds:
        - !Ref KafkaSecurityGroup
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref DataVolumeSizeGiB
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              set -euo pipefail
              dnf install -y java-17-amazon-corretto-headless tar gzip curl
              cd /tmp
              curl --fail --silent --show-error --location --output kafka.tgz "https://downloads.apache.org/kafka/${KafkaVersion}/kafka_2.13-${KafkaVersion}.tgz"
              echo '01186A5086B5AE753811EE71808A797BAEC1303D4E0D4B1C0ACF42C489654A7B8988136F8469D0B66F0BE439F8E3E9B816171EA0B0D7A36462B07AA2D3EF0023  kafka.tgz' | sha512sum --check --status
              tar -xzf kafka.tgz -C /opt
              ln -sfn "/opt/kafka_2.13-${KafkaVersion}" /opt/kafka
              install -d -m 0755 /var/lib/zookeeper /var/lib/kafka
              printf '%s\n' '${NodeId}' > /var/lib/zookeeper/myid
              cat > /opt/kafka/config/zookeeper.properties <<'ZKCFG'
              dataDir=/var/lib/zookeeper
              clientPort=2181
              initLimit=10
              syncLimit=5
              tickTime=2000
              4lw.commands.whitelist=ruok,srvr,stat
              server.1=10.20.1.11:2888:3888;2181
              server.2=10.20.1.12:2888:3888;2181
              server.3=10.20.1.13:2888:3888;2181
              ZKCFG
              TOKEN=$(curl --fail --silent --show-error -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 21600' http://169.254.169.254/latest/api/token)
              PUBLIC_IP=$(curl --fail --silent --show-error -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/public-ipv4)
              cat > /opt/kafka/config/server.properties <<KAFKACFG
              broker.id=${NodeId}
              listeners=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094
              advertised.listeners=INTERNAL://${NodePrivateIp}:9092,EXTERNAL://$PUBLIC_IP:9094
              listener.security.protocol.map=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
              inter.broker.listener.name=INTERNAL
              zookeeper.connect=10.20.1.11:2181,10.20.1.12:2181,10.20.1.13:2181
              log.dirs=/var/lib/kafka
              num.partitions=3
              default.replication.factor=3
              min.insync.replicas=2
              offsets.topic.replication.factor=3
              transaction.state.log.replication.factor=3
              transaction.state.log.min.isr=2
              auto.create.topics.enable=false
              KAFKACFG
              cat > /etc/systemd/system/zookeeper.service <<'UNIT'
              [Unit]
              Description=Apache ZooKeeper
              After=network-online.target
              Wants=network-online.target
              [Service]
              Type=simple
              ExecStart=/opt/kafka/bin/zookeeper-server-start.sh /opt/kafka/config/zookeeper.properties
              Restart=on-failure
              RestartSec=5
              [Install]
              WantedBy=multi-user.target
              UNIT
              cat > /etc/systemd/system/kafka.service <<'UNIT'
              [Unit]
              Description=Apache Kafka broker
              After=network-online.target zookeeper.service
              Requires=zookeeper.service
              [Service]
              Type=simple
              ExecStart=/opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/server.properties
              Restart=on-failure
              RestartSec=10
              [Install]
              WantedBy=multi-user.target
              UNIT
              systemctl daemon-reload
              systemctl enable --now zookeeper.service
              systemctl enable --now kafka.service
            - NodeId: '1'
              NodePrivateIp: 10.20.1.11
              KafkaVersion: !Ref KafkaVersion
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-kafka-1'
        - Key: Role
          Value: kafka-zookeeper
