Outputs:
  KafkaBootstrapServers:
    Description: >-
      Kafka bootstrap servers; configure your client to use PLAINTEXT and port 9094.
      This cluster is suitable only for restricted development and demonstration use.
    Value: !Join
      - ','
      - - !Sub '${KafkaNode1.PublicIp}:9094'
        - !Sub '${KafkaNode2.PublicIp}:9094'
        - !Sub '${KafkaNode3.PublicIp}:9094'
  KafkaNode1PublicIp:
    Description: Public IP of broker 1; connect to port 9094.
    Value: !GetAtt KafkaNode1.PublicIp
  KafkaNode2PublicIp:
    Description: Public IP of broker 2; connect to port 9094.
    Value: !GetAtt KafkaNode2.PublicIp
  KafkaNode3PublicIp:
    Description: Public IP of broker 3; connect to port 9094.
    Value: !GetAtt KafkaNode3.PublicIp
  SsmNode1:
    Description: EC2 instance ID for Session Manager access.
    Value: !Ref KafkaNode1
  SsmNode2:
    Description: EC2 instance ID for Session Manager access.
    Value: !Ref KafkaNode2
  SsmNode3:
    Description: EC2 instance ID for Session Manager access.
    Value: !Ref KafkaNode3


